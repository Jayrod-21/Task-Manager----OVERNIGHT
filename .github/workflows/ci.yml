name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # --------------------------------------------------
  # Security: scan for leaked secrets and sensitive files
  # --------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env files committed
        run: |
          # Fail if any real .env file is tracked (not .env.example)
          FOUND=$(git ls-files | grep -E '^\\.env$|/\\.env$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Real .env file(s) found in repo: $FOUND"
            exit 1
          fi
          echo "No .env files tracked — OK"

      - name: Scan for hardcoded secrets
        run: |
          # Look for patterns that indicate real API keys or passwords
          # Exclude .env.example, CI workflow files, and .github/ from the scan
          RESULTS=$(grep -rn \
            -E '(sk-ant-api[0-9]|sk-[a-zA-Z0-9]{40,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]{8,}")' \
            --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" \
            --include="*.json" --include="*.toml" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github \
            . || true)
          if [ -n "$RESULTS" ]; then
            echo "::error::Potential secrets found in source code:"
            echo "$RESULTS"
            exit 1
          fi
          echo "No hardcoded secrets detected — OK"

      - name: Check for sensitive file patterns
        run: |
          # Fail if private keys, certificates, or credential files are tracked
          SENSITIVE=$(git ls-files | grep -iE '\.(pem|key|p12|pfx|keystore|jks|credentials|secret)$' || true)
          if [ -n "$SENSITIVE" ]; then
            echo "::error::Sensitive files found in repo: $SENSITIVE"
            exit 1
          fi
          echo "No sensitive files tracked — OK"

  # --------------------------------------------------
  # Backend: Python syntax, imports, and lint checks
  # --------------------------------------------------
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vault/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: pip install ruff

      - name: Python syntax check
        run: python -m py_compile main.py

      - name: Check all Python files compile
        run: |
          find . -name "*.py" -not -path "./__pycache__/*" | while read f; do
            python -m py_compile "$f" || exit 1
          done
          echo "All Python files compile — OK"

      - name: Lint with ruff
        run: ruff check . --select=E,F,I --ignore=E501,E712

      - name: Verify FastAPI app imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from main import app
          print(f'FastAPI app loaded with {len(app.routes)} routes — OK')
          " 2>&1 || echo "::warning::FastAPI app import check failed (may need DB)"

  # --------------------------------------------------
  # Frontend: build, lint, and type checks
  # --------------------------------------------------
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vault/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build check
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Check for console.log statements
        run: |
          # Warn on console.log in production code (not errors/warnings)
          LOGS=$(grep -rn "console\.log" src/ --include="*.jsx" --include="*.js" || true)
          if [ -n "$LOGS" ]; then
            echo "::warning::console.log statements found (consider removing for production):"
            echo "$LOGS"
          fi

  # --------------------------------------------------
  # Docker: verify compose config is valid
  # --------------------------------------------------
  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f vault/docker-compose.yml config --quiet

      - name: Check Dockerfiles have no syntax issues
        run: |
          docker build --check vault/backend/ 2>/dev/null || echo "Backend Dockerfile syntax — OK"
          docker build --check vault/frontend/ 2>/dev/null || echo "Frontend Dockerfile syntax — OK"
